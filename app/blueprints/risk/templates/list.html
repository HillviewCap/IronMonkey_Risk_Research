{% extends "base.html" %} {% block title %}Risk Assessments{% endblock %} {%
block content %}
<div
  class="container mx-auto px-4 py-8"
  x-data="{
        filters: {
            client_id: '{{ filters.client_id or '' }}',
            status: '{{ filters.status or '' }}',
            assessment_type: '{{ filters.assessment_type or '' }}',
            framework_category: '{{ filters.framework_category or '' }}',
            min_risk_score: '{{ filters.min_risk_score or '' }}',
            max_risk_score: '{{ filters.max_risk_score or '' }}'
        },
        assessments: {{ assessments | tojson | safe }},
        isLoading: false,
        pagination: {}
     }"
  x-data="assessmentListComponent()"
  x-init="console.log('Alpine initialized')"
>
  <!-- Header Section -->
  <div
    class="flex justify-between items-center mb-6 border-b pb-4 border-gray-200"
  >
    <div>
      <h1 class="text-3xl font-bold text-gray-800">Risk Assessments</h1>
      <p class="text-lg text-gray-600">View and manage all risk assessments</p>
    </div>
    <div>
      <a
        href="{{ url_for('risk.assessment_new') }}"
        class="py-2 px-4 bg-blue-600 text-white rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2"
        >New Assessment</a
      >
    </div>
  </div>

  <!-- Filter Section -->
  <div class="mb-6 bg-white p-4 shadow rounded-lg">
    <h2 class="text-xl font-semibold mb-4 text-gray-800">Filters</h2>
    <form @submit.prevent="fetchAssessments">
      <div class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-4">
        <div>
          <label for="client_id" class="block text-sm font-medium text-gray-700"
            >Client</label
          >
          <select
            id="client_id"
            name="client_id"
            x-model="filters.client_id"
            class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-300 focus:ring focus:ring-indigo-200 focus:ring-opacity-50"
          >
            <option value="">All Clients</option>
            {% for client in clients %}
            <option value="{{ client.id }}">{{ client.name }}</option>
            {% endfor %}
          </select>
        </div>
        <div>
          <label for="status" class="block text-sm font-medium text-gray-700"
            >Status</label
          >
          <select
            id="status"
            name="status"
            x-model="filters.status"
            class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-300 focus:ring focus:ring-indigo-200 focus:ring-opacity-50"
          >
            <option value="">All Statuses</option>
            <option value="draft">Draft</option>
            <option value="in_progress">In Progress</option>
            <option value="review">Review</option>
            <option value="complete">Complete</option>
          </select>
        </div>
        <div>
          <label
            for="assessment_type"
            class="block text-sm font-medium text-gray-700"
            >Assessment Type</label
          >
          <select
            id="assessment_type"
            name="assessment_type"
            x-model="filters.assessment_type"
            class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-300 focus:ring focus:ring-indigo-200 focus:ring-opacity-50"
          >
            <option value="">All Types</option>
            {% for type in assessment_types %}
            <option value="{{ type }}">{{ type }}</option>
            {% endfor %}
          </select>
        </div>
        <div>
          <label
            for="framework_category"
            class="block text-sm font-medium text-gray-700"
            >Framework Category</label
          >
          <select
            id="framework_category"
            name="framework_category"
            x-model="filters.framework_category"
            class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-300 focus:ring focus:ring-indigo-200 focus:ring-opacity-50"
          >
            <option value="">All Categories</option>
            {% for category in framework_categories %}
            <option value="{{ category }}">{{ category }}</option>
            {% endfor %}
          </select>
        </div>
        <div>
          <label
            for="min_risk_score"
            class="block text-sm font-medium text-gray-700"
            >Min Risk Score</label
          >
          <input
            type="number"
            step="0.1"
            id="min_risk_score"
            name="min_risk_score"
            x-model.number="filters.min_risk_score"
            class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-300 focus:ring focus:ring-indigo-200 focus:ring-opacity-50"
          />
        </div>
        <div>
          <label
            for="max_risk_score"
            class="block text-sm font-medium text-gray-700"
            >Max Risk Score</label
          >
          <input
            type="number"
            step="0.1"
            id="max_risk_score"
            name="max_risk_score"
            x-model.number="filters.max_risk_score"
            class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-300 focus:ring focus:ring-indigo-200 focus:ring-opacity-50"
          />
        </div>
      </div>
      <div class="mt-4 flex justify-end space-x-2">
        <button
          type="button"
          @click="clearFilters"
          class="py-2 px-4 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50"
        >
          Clear Filters
        </button>
        <button
          type="button"
          @click="fetchAssessments"
          :disabled="isLoading"
          class="py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 disabled:opacity-50"
        >
          <span x-show="!isLoading">Apply Filters</span>
          <span x-show="isLoading">Loading...</span>
        </button>
      </div>
    </form>
  </div>

  <!-- Assessment List Table -->
  <div class="bg-white shadow overflow-hidden sm:rounded-lg">
    <table class="min-w-full divide-y divide-gray-200">
      <thead class="bg-gray-50">
        <tr>
          <th
            scope="col"
            class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
          >
            Name
          </th>
          <th
            scope="col"
            class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
          >
            Client
          </th>
          <th
            scope="col"
            class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
          >
            Type
          </th>
          <th
            scope="col"
            class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
          >
            Status
          </th>
          <th
            scope="col"
            class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
          >
            Risk Score
          </th>
          <th
            scope="col"
            class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
          >
            Updated
          </th>
          <th scope="col" class="relative px-6 py-3">
            <span class="sr-only">Actions</span>
          </th>
        </tr>
      </thead>
      <tbody class="bg-white divide-y divide-gray-200">
        <template x-if="isLoading">
          <tr>
            <td
              colspan="7"
              class="px-6 py-4 whitespace-nowrap text-sm text-gray-500 text-center"
            >
              Loading assessments...
            </td>
          </tr>
        </template>
        <template x-if="!isLoading && assessments.length === 0">
          <tr>
            <td
              colspan="7"
              class="px-6 py-4 whitespace-nowrap text-sm text-gray-500 text-center"
            >
              No assessments found matching the criteria.
            </td>
          </tr>
        </template>
        <template x-for="assessment in assessments" :key="assessment.id">
          <tr>
            <td class="px-6 py-4 whitespace-nowrap">
              <a
                :href="`/assessments/${assessment.id}`"
                class="text-sm font-medium text-indigo-600 hover:text-indigo-900"
                x-text="assessment.name"
              ></a>
            </td>
            <td
              class="px-6 py-4 whitespace-nowrap text-sm text-gray-500"
              x-text="assessment.client?.name || 'N/A'"
            ></td>
            <!-- Assuming client name might be nested or missing -->
            <td
              class="px-6 py-4 whitespace-nowrap text-sm text-gray-500"
              x-text="assessment.assessment_type || 'N/A'"
            ></td>
            <td class="px-6 py-4 whitespace-nowrap">
              <span
                class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full"
                :class="{
                                      'bg-green-100 text-green-800': assessment.status === 'complete',
                                      'bg-yellow-100 text-yellow-800': assessment.status === 'in_progress',
                                      'bg-blue-100 text-blue-800': assessment.status === 'review',
                                      'bg-gray-100 text-gray-800': !['complete', 'in_progress', 'review'].includes(assessment.status)
                                  }"
                x-text="assessment.status ? assessment.status.charAt(0).toUpperCase() + assessment.status.slice(1) : 'N/A'"
              >
              </span>
            </td>
            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
              <template
                x-if="assessment.risk_score !== null && assessment.risk_score !== undefined"
              >
                <span
                  class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full"
                  :class="{
                                          'bg-red-100 text-red-800': assessment.risk_score >= 75,
                                          'bg-orange-100 text-orange-800': assessment.risk_score >= 50 && assessment.risk_score < 75,
                                          'bg-yellow-100 text-yellow-800': assessment.risk_score >= 25 && assessment.risk_score < 50,
                                          'bg-green-100 text-green-800': assessment.risk_score < 25
                                      }"
                  x-text="assessment.risk_score.toFixed(1)"
                >
                </span>
              </template>

              <script>
                // Function to get CSRF token from meta tag (if using Flask-WTF pattern)
                function getCsrfToken() {
                    const csrfMeta = document.querySelector('meta[name="csrf-token"]');
                    return csrfMeta ? csrfMeta.getAttribute('content') : '{{ csrf_token() }}'; // Fallback to Jinja render
                }

                // Function to handle API responses (simplified for GET list)
                async function handleListResponse(response, errorMessagePrefix) {
                    const data = await response.json();
                    if (response.ok && data.status === 'success') {
                        return data.data; // Return the data part containing assessments and pagination
                    } else {
                        const message = data.error?.message || 'An unknown error occurred.';
                        alert(`${errorMessagePrefix}: ${message}`);
                        console.error('API Error:', data.error || data);
                        return null; // Indicate failure
                    }
                }

                // Helper to format date string (basic example)
                function formatDate(dateString) {
                    if (!dateString) return 'N/A';
                    try {
                        const date = new Date(dateString);
                        // Format as YYYY-MM-DD
                        return date.toISOString().split('T')[0];
                    } catch (e) {
                        console.error("Error formatting date:", dateString, e);
                        return dateString; // Return original if formatting fails
                    }
                }

                function assessmentListComponent() {
                    return {
                        // Initial state from server-side rendering
                        filters: {
                            client_id: '{{ filters.client_id or '' }}',
                            status: '{{ filters.status or '' }}',
                            assessment_type: '{{ filters.assessment_type or '' }}',
                            framework_category: '{{ filters.framework_category or '' }}',
                            min_risk_score: '{{ filters.min_risk_score or '' }}',
                            max_risk_score: '{{ filters.max_risk_score or '' }}',
                            // Add sort and pagination defaults if needed
                            sort_by: 'updated_at',
                            sort_order: 'desc',
                            page: 1,
                            per_page: 20
                        },
                        assessments: {{ assessments | tojson | safe }},
                        isLoading: false,
                        pagination: { // Initialize pagination info
                            page: 1,
                            per_page: 20,
                            total_pages: 1, // Placeholder, update from API
                            total_items: 0 // Placeholder, update from API
                        },

                        fetchAssessments() {
                            this.isLoading = true;
                            const params = new URLSearchParams();
                            // Add only non-empty filters to params
                            for (const key in this.filters) {
                                // Only include filters, not pagination/sort info here
                                if (['client_id', 'status', 'assessment_type', 'framework_category', 'min_risk_score', 'max_risk_score'].includes(key)) {
                                     if (this.filters[key] !== null && this.filters[key] !== '') {
                                        params.append(key, this.filters[key]);
                                     }
                                }
                            }
                            // Add sort and pagination params
                            params.append('sort_by', this.filters.sort_by);
                            params.append('sort_order', this.filters.sort_order);
                            params.append('page', this.pagination.page);
                            params.append('per_page', this.pagination.per_page);


                            const url = `/api/v1/risk-assessments/?${params.toString()}`;
                            console.log("Fetching:", url); // Debugging

                            fetch(url, {
                                method: 'GET',
                                headers: {
                                    'Accept': 'application/json',
                                    // No CSRF needed for GET usually
                                }
                            })
                            .then(response => handleListResponse(response, 'Error fetching assessments'))
                            .then(data => {
                                if (data) {
                                    this.assessments = data.assessments;
                                    this.pagination = data.pagination;
                                    console.log("Fetched assessments:", this.assessments); // Debugging
                                } else {
                                    // Handle error case if needed, maybe clear list
                                    this.assessments = [];
                                    this.pagination = {};
                                }
                            })
                            .catch(error => {
                                console.error('Fetch Error:', error);
                                alert('A network error occurred while fetching assessments.');
                                this.assessments = []; // Clear list on network error
                                this.pagination = {};
                            })
                            .finally(() => {
                                this.isLoading = false;
                            });
                        },

                        clearFilters() {
                             this.filters = {
                                client_id: '', status: '', assessment_type: '', framework_category: '',
                                min_risk_score: '', max_risk_score: '', sort_by: 'updated_at', sort_order: 'desc'
                             };
                             this.pagination.page = 1; // Reset to first page
                             this.fetchAssessments();
                        },

                         // Expose formatDate to the template
                        formatDate: formatDate
                    }
                }
              </script>

              <template
                x-if="assessment.risk_score === null || assessment.risk_score === undefined"
              >
                <span>N/A</span>
              </template>
            </td>
            <td
              class="px-6 py-4 whitespace-nowrap text-sm text-gray-500"
              x-text="formatDate(assessment.updated_at)"
            ></td>
            <td
              class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium"
            >
              <a
                :href="`/assessments/${assessment.id}`"
                class="text-indigo-600 hover:text-indigo-900 mr-3"
                >View</a
              >
              <a
                :href="`/assessments/${assessment.id}/edit`"
                class="text-blue-600 hover:text-blue-900"
                >Edit</a
              >
            </td>
          </tr>
        </template>
      </tbody>
    </table>
  </div>
  <!-- Pagination Controls (Add later if needed) -->
</div>

<!-- Add JavaScript block at the end -->
{% endblock %}
