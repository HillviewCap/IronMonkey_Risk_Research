<![CDATA[<!DOCTYPE html> <html> <head> <meta charset="UTF-8"> <title>Client
Search</title> <style> table, th, td { border: 1px solid black; border-collapse:
collapse; padding: 8px; } th { background: #f2f2f2; } </style> </head> <body>
<h1>Client Search</h1> <form id="searchForm"> <label for="query">Search:</label>
<input type="text" id="query" name="query" placeholder="Client Name, Industry,
City"> <label for="industry">Industry:</label> <select id="industry"
name="industry"> <option value="">All</option> <option
value="Technology">Technology</option> <option value="Finance">Finance</option>
<option value="Healthcare">Healthcare</option> </select> <label
for="country">Country:</label> <select id="country" name="country"> <option
value="">All</option> <option value="USA">USA</option> <option
value="UK">UK</option> <option value="Canada">Canada</option> </select> <button
type="submit">Search</button> </form> <br> <table id="resultsTable"
style="width:100%; display:none;"> <thead> <tr> <th>Client Name</th>
<th>Industry</th> <th>Locations</th> </tr> </thead> <tbody></tbody> </table>
<script> document.getElementById('searchForm').addEventListener('submit',
function(event) { event.preventDefault(); var query =
document.getElementById('query').value; var industry =
document.getElementById('industry').value; var country =
document.getElementById('country').value; var url = '/api/v1/clients/search?';
if (query) { url += 'query=' + encodeURIComponent(query) + '&'; } if (industry)
{ url += 'industry=' + encodeURIComponent(industry) + '&'; } if (country) { url
+= 'country=' + encodeURIComponent(country); } fetch(url) .then(response =>
response.json()) .then(data => { var table =
document.getElementById('resultsTable'); var tbody =
table.querySelector('tbody'); tbody.innerHTML = ''; if (data.data.length > 0) {
data.data.forEach(client => { var row = document.createElement('tr'); var
nameCell = document.createElement('td'); nameCell.textContent = client.name; var
industryCell = document.createElement('td'); industryCell.textContent =
client.industry; var locationCell = document.createElement('td');
locationCell.textContent = client.locations.map(loc => loc.city + ', ' +
loc.country).join(' | '); row.appendChild(nameCell);
row.appendChild(industryCell); row.appendChild(locationCell);
tbody.appendChild(row); }); table.style.display = 'table'; } else {
table.style.display = 'none'; alert('No results found.'); } }) .catch(err => {
console.error(err); alert('Error occurred during search.'); }); }); </script>
</body> </html>]]>
